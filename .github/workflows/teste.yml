name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  teste:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Sem dependências: não há npm install a fazer.
      - run: node teste.js
